<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENBot — by ZENSTRO</title>
<link rel="icon" type="image/png" href="/static/logo.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Space Grotesk', sans-serif;
    background: #05050a;
    color: #fff;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── NAME SCREEN ── */
  #name-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05050a;
  }

  #name-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(99,102,241,0.2) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, rgba(236,72,153,0.15) 0%, transparent 55%);
    pointer-events: none;
  }

  .name-card {
    position: relative;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 28px;
    padding: 48px 40px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  }

  .name-card .logo-wrap {
    width: 80px;
    height: 80px;
    margin: 0 auto 20px;
    border-radius: 22px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 30px rgba(99,102,241,0.4);
  }

  .name-card .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .name-card h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #a78bfa, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }

  .name-card p {
    font-size: 14px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
  }

  .name-card input {
    width: 100%;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 15px 20px;
    color: #fff;
    font-size: 16px;
    font-family: 'Space Grotesk', sans-serif;
    outline: none;
    text-align: center;
    transition: border-color 0.3s, box-shadow 0.3s;
    margin-bottom: 16px;
  }

  .name-card input:focus {
    border-color: rgba(167,139,250,0.6);
    box-shadow: 0 0 25px rgba(167,139,250,0.15);
  }

  .name-card input::placeholder { color: rgba(255,255,255,0.25); }

  .name-card button {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    border: none;
    border-radius: 14px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 8px 30px rgba(99,102,241,0.4);
  }

  .name-card button:hover { opacity: 0.9; transform: translateY(-1px); }
  .name-card button:active { transform: translateY(0); }

  .name-card .brand {
    margin-top: 24px;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
  }

  .name-card .brand span {
    background: linear-gradient(90deg, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 600;
  }

  /* ── CHAT SCREEN ── */
  #chat-screen { display: none; flex-direction: column; height: 100vh; }

  /* particles bg */
  #chat-screen::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 15% 15%, rgba(99,102,241,0.12) 0%, transparent 45%),
      radial-gradient(ellipse at 85% 85%, rgba(236,72,153,0.08) 0%, transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  /* header */
  .header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px;
    background: rgba(255,255,255,0.03);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
  }

  .h-logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 16px rgba(99,102,241,0.4);
    flex-shrink: 0;
  }

  .h-logo img { width: 100%; height: 100%; object-fit: cover; }

  .h-info h2 { font-size: 15px; font-weight: 600; }

  .h-status {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
  }

  .dot {
    width: 6px; height: 6px;
    background: #22c55e;
    border-radius: 50%;
    animation: blink 2s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .h-brand {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    text-align: right;
    line-height: 1.7;
  }

  .h-brand strong {
    background: linear-gradient(90deg, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 11px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    z-index: 1;
    scrollbar-width: thin;
    scrollbar-color: rgba(99,102,241,0.2) transparent;
  }

  .msg-row { display: flex; flex-direction: column; }
  .msg-row.user { align-items: flex-end; }
  .msg-row.ai { align-items: flex-start; }

  .bubble {
    max-width: 76%;
    padding: 11px 16px;
    font-size: 15px;
    line-height: 1.55;
    word-wrap: break-word;
    animation: pop 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes pop { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .bubble.user {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-radius: 20px 20px 4px 20px;
    box-shadow: 0 4px 18px rgba(99,102,241,0.3);
  }

  .bubble.ai {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px 20px 20px 4px;
  }

  .msg-time {
    font-size: 10px;
    color: rgba(255,255,255,0.2);
    margin-top: 3px;
    padding: 0 4px;
  }

  /* typing */
  .typing-row {
    display: none;
    padding: 0 14px 8px;
    position: relative;
    z-index: 1;
  }

  .typing-bubble {
    display: inline-flex;
    gap: 5px;
    align-items: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 11px 16px;
    border-radius: 20px 20px 20px 4px;
  }

  .typing-bubble span {
    width: 7px; height: 7px;
    background: rgba(167,139,250,0.8);
    border-radius: 50%;
    animation: tb 1.2s infinite;
  }
  .typing-bubble span:nth-child(2) { animation-delay: 0.2s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes tb { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-7px);opacity:1} }

  /* input */
  .input-bar {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.03);
    border-top: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
  }

  .input-bar input {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 24px;
    padding: 13px 20px;
    color: #fff;
    font-size: 15px;
    font-family: 'Space Grotesk', sans-serif;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .input-bar input:focus {
    border-color: rgba(99,102,241,0.5);
    box-shadow: 0 0 20px rgba(99,102,241,0.12);
  }

  .input-bar input::placeholder { color: rgba(255,255,255,0.25); }

  .send-btn {
    width: 48px; height: 48px;
    background: linear-gradient(135deg, #6366f1, #ec4899);
    border: none;
    border-radius: 50%;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(99,102,241,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .send-btn:hover { transform: scale(1.08); }
  .send-btn:active { transform: scale(0.94); }

  /* footer watermark */
  .footer-wm {
    text-align: center;
    font-size: 10px;
    color: rgba(255,255,255,0.12);
    padding: 6px 0 10px;
    position: relative;
    z-index: 1;
  }

  .footer-wm span {
    background: linear-gradient(90deg, #6366f1, #ec4899);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 600;
  }
</style>
</head>
<body>

<!-- NAME SCREEN -->
<div id="name-screen">
  <div class="name-card">
    <div class="logo-wrap">
      <img src="/static/logo.png" alt="ZENSTRO" onerror="this.parentElement.innerHTML='🤙'">
    </div>
    <h1>ZENBot</h1>
    <p>Tera naya desi best friend — 24/7 available 😎</p>
    <input type="text" id="name-input" placeholder="Apna naam bata yaar..." maxlength="30" />
    <button onclick="startChat()">Chal Shuru Karte Hain 🚀</button>
    <div class="brand">Powered by <span>ZENSTRO IT Solutions</span> · CEO Shubham</div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <div class="header">
    <div class="header-left">
      <div class="h-logo">
        <img src="/static/logo.png" alt="ZENBot" onerror="this.parentElement.innerHTML='🤙'">
      </div>
      <div class="h-info">
        <h2>ZENBot</h2>
        <div class="h-status"><div class="dot"></div> <span id="h-username">yaar</span> ke saath online</div>
      </div>
    </div>
    <a href="/privacy" style="font-size:11px;color:rgba(255,255,255,0.3);text-decoration:none;padding:6px 12px;border:1px solid rgba(255,255,255,0.1);border-radius:20px;">Privacy Policy</a>
  </div>

  <div class="messages" id="messages"></div>

  <div class="typing-row" id="typing">
    <div class="typing-bubble"><span></span><span></span><span></span></div>
  </div>

  <div class="input-bar">
    <input type="text" id="msg-input" placeholder="kuch bhi bol yaar..." autocomplete="off" />
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>

  <div class="footer-wm">© ZENBot · <a href="/privacy" style="color:rgba(255,255,255,0.2);text-decoration:none;">Privacy Policy</a></div>
</div>

<script>
  let userName = "";

  document.getElementById("name-input").addEventListener("keydown", e => {
    if (e.key === "Enter") startChat();
  });

  function startChat() {
    const val = document.getElementById("name-input").value.trim();
    if (!val) { document.getElementById("name-input").focus(); return; }
    userName = val;

    document.getElementById("name-screen").style.display = "none";
    document.getElementById("chat-screen").style.display = "flex";
    document.getElementById("h-username").textContent = userName;

    // first greeting
    addMsg(`Aur bata ${userName}! kya chal raha hai 😎`, "ai");
    document.getElementById("msg-input").focus();
  }

  document.getElementById("msg-input").addEventListener("keydown", e => {
    if (e.key === "Enter") sendMessage();
  });

  function getTime() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  async function sendMessage() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";

    addMsg(text, "user");
    document.getElementById("typing").style.display = "block";
    scrollDown();

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, username: userName })
      });
      const data = await res.json();
      document.getElementById("typing").style.display = "none";
      addMsg(data.reply, "ai");
    } catch {
      document.getElementById("typing").style.display = "none";
      addMsg("yaar kuch gadbad ho gayi, dobara bol 😅", "ai");
    }
  }

  function addMsg(text, type) {
    const messages = document.getElementById("messages");
    const row = document.createElement("div");
    row.className = `msg-row ${type}`;

    const bubble = document.createElement("div");
    bubble.className = `bubble ${type}`;
    bubble.textContent = text;

    const time = document.createElement("div");
    time.className = "msg-time";
    time.textContent = getTime();

    row.appendChild(bubble);
    row.appendChild(time);
    messages.appendChild(row);
    scrollDown();
  }

  function scrollDown() {
    setTimeout(() => {
      const m = document.getElementById("messages");
      m.scrollTop = m.scrollHeight;
    }, 50);
  }
</script>
</body>
</html>
